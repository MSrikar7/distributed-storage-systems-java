name: Java CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build and run all tests
        run: |
          bash scripts/build.sh
          for test in \
            com.s3index.kv.StoreTest \
            com.s3index.kv.GroupCommitTest \
            com.s3index.metadata.MetadataTest \
            com.s3index.metadata.ReplicationTest \
            com.s3index.metadata.ReconciliationTest; do
            java -cp build/kv:build/metadata:build/test "$test"
          done
